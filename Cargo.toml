[package]
name = "drvjs"
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
repository = "https://github.com/drvlang/drvjs"
description = "Package-granular Nix fetching for pnpm projects"

[profile.release]
opt-level = 0
panic = "abort"
strip = "symbols"

[profile.release.package."*"]
opt-level = 1

[dependencies]
anyhow = "1"
indexmap = "2"
serde = "1"
serde_json = "1"
serde_yaml_ng = "0.10"
tar = { version = "0.4.46", default-features = false }
walkdir = "2"
